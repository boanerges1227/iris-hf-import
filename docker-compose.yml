services:
  iris:
    build:
      context: .
      args:
        IMAGE: ${IRIS_IMAGE:-intersystemsdc/iris-community:latest}
    container_name: iris-hf-import
    restart: unless-stopped
    environment:
      - HF_TOKEN=${HF_TOKEN:-}
      - PYTHONPATH=/home/irisowner/dev:/home/irisowner/dev/python
    ports:
      - "21974:1972"
      - "52998:52773"
    volumes:
      - ./src:/home/irisowner/dev/src
      - ./python:/home/irisowner/dev/python
      - ./tests:/home/irisowner/dev/tests
    healthcheck:
      test: ["CMD", "iris", "session", "IRIS", "-U", "USER", "##class(dc.hfloader.Loader).Health()"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 30s
